<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tính tiền bánh bao</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2d6a4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bánh bao">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2ec;--sf:#fbfcfa;--tx:#1d2b23;--mut:#6b7c70;--ac:#2d6a4f;--acx:#fff;--ln:#d5ddd3;--bt:#e3eae0;--wn:#b7791f;--wnb:#fdf1d8;--dn:#a63d2f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b17;--sf:#1c2520;--tx:#e8f0ea;--mut:#8fa196;--ac:#6fcf97;--acx:#10261a;--ln:#2e3b33;--bt:#27332c;--wn:#f0c36a;--wnb:#3a3120;--dn:#f08a7a}}
:root[data-theme="dark"]{--bg:#141b17;--sf:#1c2520;--tx:#e8f0ea;--mut:#8fa196;--ac:#6fcf97;--acx:#10261a;--ln:#2e3b33;--bt:#27332c;--wn:#f0c36a;--wnb:#3a3120;--dn:#f08a7a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Be Vietnam Pro",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:8px 12px}
.hdr h1{font-size:17px;margin:0;flex:1}
.ib{width:42px;height:42px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 120px}
.sm{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--sf)}
.sm.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.store{width:100%;text-align:left;height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font:inherit;font-weight:700;padding:0 14px;margin-bottom:12px;color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{padding:8px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);text-align:left;line-height:1.25}
.chip small{display:block;color:var(--mut);font-size:12px}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.chip.on small{color:inherit;opacity:.8}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ch b{font-weight:500}.ch small{color:var(--mut)}
.q{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 10px}
.q .n{font-size:34px;font-weight:700;color:var(--ac);line-height:1}
.q .a{font-weight:700}
.bs{display:flex;gap:5px}
.bs button{flex:1;height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--bt);font-weight:500}
.bs button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.bs button:active{transform:scale(.95)}
.empty{padding:28px 0;text-align:center;color:var(--mut)}
.ci{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--bt);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sf);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.bar .t{flex:1}.bar .t small{display:block;color:var(--mut);font-size:12px}.bar .t b{font-size:24px}
.b1,.b2{height:46px;padding:0 20px;border-radius:12px;border:0;font-weight:700}
.b1{background:var(--ac);color:var(--acx)}
.b2{background:var(--wnb);color:var(--wn)}
.b1:disabled{opacity:.4}
.full{width:100%}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--sf);z-index:60;transform:translateX(-100%);transition:transform .25s;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 14px;border-right:1px solid var(--ln)}
#dr.on{transform:none}
#dr{overflow:hidden;visibility:hidden;transition:transform .25s,visibility 0s .25s}
#dr.on{visibility:visible;transition:transform .25s}
.mi{overflow:hidden}
#lg small{display:block;font-weight:400;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dr h2{margin:0 0 14px;font-size:18px}
.mi{display:block;width:100%;text-align:left;padding:13px 12px;border-radius:10px;border:0;background:none;font-weight:500}
.mi.on{background:var(--bt);color:var(--ac);font-weight:700}
#md{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
#md.on{display:flex}
.sheet{background:var(--sf);border-radius:18px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:18px}
.sheet h2{margin:0 0 10px;font-size:19px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--ln)}
.ln small{display:block;color:var(--mut);font-size:13px}
.tt{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0}
.tt b{font-size:26px;color:var(--ac)}
.btns{display:flex;gap:10px}.btns button{flex:1}
.rc{text-align:center}
.rc .ln{text-align:left}
.rc .rh{font-size:34px}.rc p{margin:2px 0;color:var(--mut);font-size:13px}
.rc .th{margin:4px 0 14px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1}
.inp{width:100%;height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;padding:0 12px;margin-bottom:12px}
.sum{font-size:30px;font-weight:700;color:var(--ac);margin:2px 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
tr.z td{color:var(--mut)}
tfoot td{font-weight:700;border-bottom:0}
.pc{display:flex;align-items:center;gap:14px}
.pie{width:120px;height:120px;flex:none}
.lg{flex:1;font-size:13px}.lg div{display:flex;align-items:center;gap:6px;padding:2px 0}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg span{margin-left:auto;font-weight:500}
.card h3{margin:0 0 10px;font-size:15px}
.hi{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hi div{display:flex;justify-content:space-between;gap:8px}
.hi small{color:var(--mut);font-size:13px}
.hw{position:relative}.hw .hi{padding-bottom:42px}
.dl{position:absolute;right:10px;bottom:18px;color:var(--dn);border-color:var(--dn)}
</style>
</head>
<body>
<header class="hdr">
  <button class="ib" id="mb" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
  <button class="ib" id="bk" aria-label="Về trang chủ" style="display:none"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"/></svg></button>
  <h1 id="ttl">Bảng tính</h1>
  <button class="sm" id="cs" aria-label="Đồng bộ">☁…</button>
  <button class="sm" id="hh">Lịch sử hóa đơn</button>
</header>
<div id="ov"></div>
<nav id="dr"><h2>🥟 Bánh bao</h2>
  <button class="mi" data-v="home">Bảng tính</button>
  <button class="mi" data-v="stats">Thống kê</button>
  <button class="mi" data-v="dc">Đi chợ - Nhập hàng</button>
  <button class="mi" data-v="dcs">Đi chợ - Thống kê</button>
  <button class="mi" id="lg"><span id="lgt">Đăng nhập</span><small id="lge"></small></button>
</nav>

<main class="wrap" id="home">
  <button class="store" id="sbtn">📍 Chọn điểm bán</button>
  <div class="chips" id="chips"></div>
  <div id="cards"></div>
</main>
<div class="bar" id="bar"><div class="t"><small>Tổng tiền</small><b id="tot">0đ</b></div><button class="b1" id="ok" disabled>Xác nhận</button></div>

<main class="wrap" id="stats" hidden style="padding-bottom:40px">
  <div class="seg" id="tabs"><button class="sm" data-t="hist">Lịch sử</button><button class="sm" data-t="rev">Doanh thu</button></div>
  <div id="sf"></div>
  <div id="sb"></div>
</main>

<iframe id="dcf" title="Đi chợ" style="display:none;position:fixed;left:0;right:0;bottom:0;width:100%;height:calc(100% - 59px - env(safe-area-inset-top,0px));border:0;z-index:20;background:var(--bg)"></iframe>
<div id="md"></div>

<script>
var MENU=[
 {id:"b2",n:"Bánh thịt 2 trứng",s:"2 trứng",p:17000,lab:"17k"},
 {id:"b1",n:"Bánh thịt 1 trứng",s:"1 trứng",p:12000,lab:"12k"},
 {id:"chay",n:"Bánh chay",s:"chay",p:12000,lab:"12k"},
 {id:"mini",n:"Bánh mini",s:"mini",p:10000,lab:"10k/3c"},
 {id:"xx",n:"Bánh xúc xích",s:"X.Xích",p:17000,lab:"17k"},
 {id:"ga",n:"Bánh gà nấm",s:"gà nấm",p:18000,lab:"18k"},
 {id:"xxiu",n:"Bánh xá xíu",s:"X.Xíu",p:20000,lab:"20k"},
 {id:"kn",n:"Bánh không nhân",s:"Ko nhân",p:5000,lab:"5k"},
 {id:"dx",n:"Bánh đậu xanh",s:"Đ.Xanh",p:5000,lab:"5k"}
];
var KEY="banhbao_pos_v1", mem={v:1,orders:{}};
/* Dữ liệu: {v:1, orders:{<orderId>:{id,no,createdAt,date,items:{<menuId>:{name,price,qty,amount}},total,status}}}
   Dạng map theo id, giống cấu trúc Realtime Database: orders/<id> */
function db(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem}
function put(d){mem=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function orders(){var o=db().orders||{};return Object.keys(o).map(function(k){return o[k]}).sort(function(a,b){return b.createdAt-a.createdAt})}
var $=function(i){return document.getElementById(i)};
var z=function(n){return(n<10?"0":"")+n};
function money(n){return n.toLocaleString("vi-VN")+"đ"}
function dkey(t){var d=new Date(t);return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function dstr(k){var p=k.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function tstr(t){var d=new Date(t);return z(d.getHours())+":"+z(d.getMinutes())}
function by(id){return MENU.filter(function(m){return m.id===id})[0]}

/* ---- trang tính ---- */
var open=[], cart={};
function amt(m,q){return m.id==="mini"?Math.floor(q/3)*10000+(q%3)*3400:q*m.p}
function note(m,q){if(m.id!=="mini")return"";var a=Math.floor(q/3),r=q%3,s=[];if(a)s.push(a+" × "+money(10000));if(r)s.push(r+" × "+money(3400));return q+" cái: "+s.join(" + ")}
function total(){return open.reduce(function(s,id){return s+amt(by(id),cart[id]||0)},0)}
function items(){return open.filter(function(id){return cart[id]>0})}
function renderHome(){
 $("chips").innerHTML=MENU.map(function(m){return '<button class="chip'+(open.indexOf(m.id)>-1?' on':'')+'" data-c="'+m.id+'">'+m.s+'<small>'+(m.lab||money(m.p))+'</small></button>'}).join("");
 $("cards").innerHTML=open.length?open.map(function(id){var m=by(id),q=cart[id]||0;
  return '<div class="card"><div class="ch"><b>'+m.n+'</b><small>'+(m.lab||money(m.p))+'</small></div>'+
  '<div class="q"><span class="n">'+q+'</span><span class="a">'+money(amt(m,q))+'</span></div>'+
  '<div class="bs">'+[-5,-2,-1,1,2,5].map(function(d){return '<button class="'+(d>0?'p':'')+'" data-a="'+id+'" data-d="'+d+'">'+(d>0?'+':'−')+Math.abs(d)+'</button>'}).join("")+'</div></div>'}).join(""):
  '<div class="empty">Chạm tên bánh phía trên để thêm vào đơn.</div>';
 $("tot").textContent=money(total());$("ok").disabled=!items().length||!curStore;
}
$("chips").onclick=function(e){var c=e.target.closest("[data-c]");if(!c)return;var id=c.dataset.c,i=open.indexOf(id);
 if(i>-1){open.splice(i,1);delete cart[id]}else{open.unshift(id);cart[id]=0}renderHome()};
$("cards").onclick=function(e){var b=e.target.closest("[data-a]");if(!b)return;var id=b.dataset.a;cart[id]=Math.max(0,(cart[id]||0)+ +b.dataset.d);renderHome()};

/* ---- popup ---- */
function lines(its){return its.map(function(r){return '<div class="ln"><span>'+r.name+'<small>'+(r.note||r.qty+' × '+money(r.price))+'</small></span><b>'+money(r.amount)+'</b></div>'}).join("")}
function modal(h){$("md").innerHTML=h;$("md").classList.add("on")}
function closeModal(){$("md").classList.remove("on");$("md").innerHTML=""}
$("ok").onclick=function(){
 var rows=items().map(function(id){var m=by(id);return{name:m.n,price:m.p,qty:cart[id],amount:amt(m,cart[id]),note:note(m,cart[id])}});
 var dv=function(){var x=parseInt(($("dc")?$("dc").value:"").replace(/\D/g,""),10)||0;return Math.min(x,total())};
 modal('<div class="sheet"><h2>Xác nhận hóa đơn</h2><p style="margin:0 0 6px;color:var(--mut)">📍 '+esc(sname(curStore))+'</p>'+lines(rows)+'<div class="ln"><span>Tạm tính</span><b>'+money(total())+'</b></div><p style="margin:10px 0 4px;font-size:13px;color:var(--mut)">Giảm giá (đ)</p><input class="inp" id="dc" inputmode="numeric" placeholder="0" autocomplete="off"><div class="tt"><span>Thành tiền</span><b id="gt">'+money(total())+'</b></div><div class="btns"><button class="b2" id="m1">Sửa lại</button><button class="b1" id="m2">Chốt đơn</button></div></div>');
 $("m1").onclick=closeModal;
 $("dc").oninput=function(){$("gt").textContent=money(total()-dv())};
 $("m2").onclick=function(){
  if(!authed()){needLogin("lưu đơn",function(){$("ok").onclick()});return}var d=db(),t=Date.now(),k=dkey(t),n=1,o=d.orders||{};
  Object.keys(o).forEach(function(x){if(o[x].date===k&&(o[x].storeId||"")===curStore)n++});
  var id="ord_"+t.toString(36)+Math.random().toString(36).slice(2,6),its={};
  items().forEach(function(i){var m=by(i);its[i]={name:m.n,price:m.p,qty:cart[i],amount:amt(m,cart[i]),note:note(m,cart[i])}});
  o[id]={id:id,no:n,createdAt:t,date:k,items:its,total:total()-dv(),subtotal:total(),discount:dv(),status:"paid",storeId:curStore};
  d.v=2;d.orders=o;bump(d,curStore,t);put(d);queue(id,t,o[id]);sync();
  receipt(o[id],function(){open=[];cart={};renderHome()})};
};
function receipt(o,after){
 var rows=Object.keys(o.items).map(function(k){return o.items[k]});
 modal('<div class="sheet rc"><div class="rh">🥟</div><h2>Hóa đơn</h2><p>'+esc(sname(o.storeId))+' · Đơn #'+o.no+' · '+dstr(o.date)+' · '+tstr(o.createdAt)+'</p>'+lines(rows)+(o.discount?'<div class="ln"><span>Tạm tính</span><b>'+money(o.total+o.discount)+'</b></div><div class="ln"><span>Giảm giá</span><b>-'+money(o.discount)+'</b></div>':'')+'<div class="tt"><span>Tổng cộng</span><b>'+money(o.total)+'</b></div><p class="th">Cảm ơn quý khách!</p><button class="b1 full" id="m3">Đóng</button></div>');
 $("m3").onclick=function(){closeModal();if(after)after()};
}

/* ---- menu & điều hướng ---- */
function drawer(on){$("dr").classList.toggle("on",on);$("ov").classList.toggle("on",on)}
$("mb").onclick=function(){drawer(true)};$("ov").onclick=function(){drawer(false)};
var st={store:"all",tab:"hist",mode:"day",v:{day:dkey(Date.now()),month:dkey(Date.now()).slice(0,7),year:dkey(Date.now()).slice(0,4)}};
function go(v,tab){
 var h=v==="home",s=v==="stats",d=v==="dc"||v==="dcs";
 $("home").hidden=!h;$("bar").style.display=h?"flex":"none";$("stats").hidden=!s;
 $("hh").style.display=h?"":"none";$("bk").style.display=h?"none":"grid";$("cs").style.display=d?"none":"";$("dcf").style.display=d?"block":"none";
 $("ttl").textContent=h?"Bảng tính":s?"Thống kê":v==="dc"?"Đi chợ":"Đi chợ - Thống kê";
 document.querySelectorAll(".mi").forEach(function(b){b.classList.toggle("on",b.dataset.v===v)});
 if(s){if(tab)st.tab=tab;renderStats()}
 if(d){window.__dcView=v==="dc"?"home":"stats";loadDc();try{var w=$("dcf").contentWindow;if(w.go)w.go(window.__dcView)}catch(e){}}
 drawer(false);window.scrollTo(0,0)}
document.querySelectorAll(".mi").forEach(function(b){b.onclick=function(){go(b.dataset.v)}});
$("hh").onclick=function(){go("stats","hist")};
$("bk").onclick=function(){go("home")};
$("tabs").onclick=function(e){var b=e.target.closest("[data-t]");if(b){st.tab=b.dataset.t;renderStats()}};

/* ---- thống kê ---- */
var C=["#2d6a4f","#e07a5f","#3d5a80","#e9b44c","#81b29a","#9b5de5","#c9184a","#6b705c","#f4a261"];
function renderStats(){
 if(!authed()){$("sf").innerHTML="";$("sb").innerHTML='<div class="empty">Cần đăng nhập để xem thống kê.<br><br><button class="b1" id="lk">Đăng nhập</button></div>';$("lk").onclick=function(){loginPopup()};return}
 document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.t===st.tab)});
 renderSF();st.tab==="hist"?renderHist():renderRev();
}
function renderHist(){
 var os=orders().filter(inStore),b=$("sb");
 if(!os.length){b.innerHTML='<div class="empty">Chưa có hóa đơn nào. Chốt đơn ở Bảng tính để lưu lại.</div>';return}
 b.innerHTML=os.map(function(o){var names=Object.keys(o.items).map(function(k){return o.items[k].qty+" "+o.items[k].name.replace("Bánh ","")}).join(", ");
  return '<div class="hw"><button class="hi" data-o="'+o.id+'"><div><b>Đơn #'+o.no+' · '+dstr(o.date)+' '+tstr(o.createdAt)+'</b><b>'+money(o.total)+'</b></div><small>'+esc(sname(o.storeId))+' · '+names+'</small></button><button class="sm dl" data-x="'+o.id+'">Xóa</button></div>'}).join("");
 b.onclick=function(e){var x=e.target.closest("[data-x]");if(x)return askDel(x.dataset.x);var h=e.target.closest("[data-o]");if(h)receipt(db().orders[h.dataset.o])};
}
function pie(vals){
 var t=vals.reduce(function(a,b){return a+b},0),a0=-Math.PI/2,s="",nz=vals.filter(function(v){return v>0}).length;
 if(nz===1){s='<circle cx="70" cy="70" r="64" fill="'+C[vals.findIndex(function(v){return v>0})]+'"/>'}
 else vals.forEach(function(v,i){if(!v)return;var a1=a0+v/t*2*Math.PI;
  s+='<path d="M70 70L'+(70+64*Math.cos(a0))+' '+(70+64*Math.sin(a0))+'A64 64 0 '+(a1-a0>Math.PI?1:0)+' 1 '+(70+64*Math.cos(a1))+' '+(70+64*Math.sin(a1))+'Z" fill="'+C[i]+'"/>';a0=a1});
 return '<svg class="pie" viewBox="0 0 140 140">'+s+'<circle cx="70" cy="70" r="30" fill="var(--sf)"/></svg>'}
function pieCard(title,vals,fmt){
 var t=vals.reduce(function(a,b){return a+b},0);
